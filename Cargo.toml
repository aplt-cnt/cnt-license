[workspace]
members = [".", "server"]
resolver = "2"

[package]
name = "cnt-license"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clicense"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
toml = "0.8"
ureq = "3"
