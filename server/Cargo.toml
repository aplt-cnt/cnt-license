[package]
name = "clicense-server"
version = "1.1.0"
edition = "2024"
authors = ["TaimWay <taimway@gmail.com>"]
license = "GPL-3.0"
description = "Open Source License API Server"
repository = "https://github.com/aplt-cnt/cnt-license"

[[bin]]
name = "clicense-server"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "TaimWay <taimway@gmail.com>"
section = "utils"
priority = "optional"
depends = "systemd"
extended-description = """\
clicense-server is an API server for managing open-source license \
templates. It provides a RESTful API for listing, searching, and \
exporting license templates and metadata.\
"""
assets = [
    ["../target/release/clicense-server", "usr/bin/clicense-server", "755"],
    ["packaging/assets/clicense-server.service", "etc/systemd/system/clicense-server.service", "644"],
    ["packaging/assets/config.yml", "etc/clicense-server/config.yml", "644"],
]
maintainer-scripts = "packaging/deb-scripts/"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
clap = { version = "4.6", features = ["derive"] }
colored = "3"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ureq = "3"
dirs = "6"
zip = "2"
