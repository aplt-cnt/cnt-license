[package]
name = "cnt-license"
version = "1.1.0"
edition = "2024"
authors = ["TaimWay <taimway@gmail.com>"]
license = "GPL-3.0"
description = "CLI tool for generating open source license files"
repository = "https://github.com/aplt-cnt/cnt-license"

[package.metadata.deb]
maintainer = "TaimWay <taimway@gmail.com>"
section = "utils"
priority = "optional"
depends = "clicense-server (>= 1.1.0)"
extended-description = """\
clicense is a CLI tool for generating open-source license files from \
templates. It supports built-in licenses (MIT, Apache-2.0, GPL-3.0, \
etc.), custom licenses, remote server sync, and metadata management.\
"""

[[bin]]
name = "clicense"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
toml = "1.1.2+spec-1.1.0"
ureq = "3"
zip = "2"
